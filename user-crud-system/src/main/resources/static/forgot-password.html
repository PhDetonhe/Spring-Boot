<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esqueci minha senha | Sistema de Usuários</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div id="toast-container" class="fixed top-4 right-4 z-50 w-80"></div>

  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="font-display text-xl font-bold text-indigo-700 mb-6">UserHub</div>

    <div id="form-state">
      <h1 class="font-display text-2xl font-semibold text-slate-900">Esqueci minha senha</h1>
      <p class="text-slate-500 mt-1 mb-8">
        Informe seu e-mail cadastrado. Enviaremos um link para você criar uma nova senha.
      </p>

      <form id="forgot-form" class="space-y-5" novalidate>
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input type="email" id="email" name="email" required
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            placeholder="voce@exemplo.com" />
        </div>

        <button type="submit" id="forgot-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg px-4 py-2.5 transition-colors">
          Enviar link de recuperação
        </button>
      </form>
    </div>

    <div id="success-state" class="hidden text-center py-4">
      <div class="mx-auto w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mb-4">
        ✓
      </div>
      <h2 class="font-display text-xl font-semibold text-slate-900">Verifique seu e-mail</h2>
      <p class="text-slate-500 mt-2">
        Se este e-mail estiver cadastrado, você receberá um link de recuperação em instantes.
      </p>
    </div>

    <p class="text-sm text-slate-500 mt-8 text-center">
      Lembrou a senha?
      <a href="/login.html" class="font-medium text-indigo-600 hover:text-indigo-700">Voltar para o login</a>
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
