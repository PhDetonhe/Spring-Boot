# ========================================================
# Servidor
# ========================================================
server.port=8080

# ========================================================
# Banco de dados MySQL (padrao XAMPP: usuario "root", sem senha)
# Ajuste usuario/senha/host conforme seu ambiente.
# createDatabaseIfNotExist=true cria o schema automaticamente
# na primeira conexao, se ele nao existir.
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/user_crud_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# JPA / Hibernate
# ddl-auto=update cria/atualiza as tabelas automaticamente a
# partir das entidades - nao ha uso de Flyway/Liquibase neste
# projeto, mantendo a aplicacao simples.
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========================================================
# Sessao HTTP (usada para manter o usuario logado)
# ========================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ========================================================
# Resend (https://resend.com) - envio de e-mail para
# recuperacao de senha. Gere sua API key no painel do Resend.
# ========================================================
resend.api.key=
resend.api.url=https://api.resend.com/emails
resend.from.email=Sistema de Usuarios <onboarding@resend.dev>
resend.from.name=Sistema de Usuarios

# ========================================================
# Regras de negocio - recuperacao de senha
# ========================================================
# URL base do front-end que recebe o token via query string
app.reset-password.base-url=http://localhost:8080/reset-password.html
# Tempo de validade do token de recuperacao, em minutos
app.reset-password.token-expiry-minutes=30

# ========================================================
# Logging
# ========================================================
logging.level.com.example.userauth=DEBUG
