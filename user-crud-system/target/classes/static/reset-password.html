<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha | Sistema de Usuários</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div id="toast-container" class="fixed top-4 right-4 z-50 w-80"></div>

  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="font-display text-xl font-bold text-indigo-700 mb-6">UserHub</div>

    <div id="invalid-token-state" class="hidden text-center py-4">
      <div class="mx-auto w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-2xl mb-4">
        !
      </div>
      <h2 class="font-display text-xl font-semibold text-slate-900">Link inválido</h2>
      <p class="text-slate-500 mt-2">
        Não encontramos um token de recuperação nesta página. Solicite um novo link.
      </p>
      <a href="/forgot-password.html"
        class="inline-block mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg px-4 py-2.5 transition-colors">
        Solicitar novo link
      </a>
    </div>

    <div id="form-state">
      <h1 class="font-display text-2xl font-semibold text-slate-900">Criar nova senha</h1>
      <p class="text-slate-500 mt-1 mb-8">Escolha uma nova senha para sua conta.</p>

      <form id="reset-form" class="space-y-5" novalidate>
        <div>
          <label for="new-password" class="block text-sm font-medium text-slate-700 mb-1">Nova senha</label>
          <input type="password" id="new-password" name="newPassword" required minlength="6"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            placeholder="Mínimo 6 caracteres" />
        </div>

        <div>
          <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-1">Confirmar nova senha</label>
          <input type="password" id="confirm-password" name="confirmPassword" required minlength="6"
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            placeholder="Repita a nova senha" />
        </div>

        <button type="submit" id="reset-btn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg px-4 py-2.5 transition-colors">
          Redefinir senha
        </button>
      </form>
    </div>

    <div id="success-state" class="hidden text-center py-4">
      <div class="mx-auto w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mb-4">
        ✓
      </div>
      <h2 class="font-display text-xl font-semibold text-slate-900">Senha redefinida!</h2>
      <p class="text-slate-500 mt-2">Sua senha foi atualizada com sucesso.</p>
      <a href="/login.html"
        class="inline-block mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg px-4 py-2.5 transition-colors">
        Ir para o login
      </a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
